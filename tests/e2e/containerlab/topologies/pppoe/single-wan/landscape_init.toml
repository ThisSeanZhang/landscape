# run.sh adds the version reported by the binary under test.
[config.time]
enabled = false

[[ifaces]]
name = "lan0"
zone_type = "lan"

[[ifaces]]
name = "wan0"
zone_type = "wan"

[[dhcpv4_services]]
iface_name = "lan0"
enable = true
[dhcpv4_services.config]
server_ip_addr = "192.0.2.1"
network_mask = 24
ip_range_start = "192.0.2.100"
ip_range_end = "192.0.2.150"
address_lease_time = 600

[[wan_links]]
name = "test-pppoe"
attach_iface_name = "wan0"
[wan_links.kind]
t = "pppoe_native"
username = "lab"
password = "lab"
requested_mru = 1492
redial_backoff_base_secs = 1
[wan_links.v4]
enable = true
[wan_links.v4.model]
t = "ipcp"
default_router = true
[wan_links.nat]
enable = true

[[route_lans]]
iface_name = "lan0"
enable = true

[[route_wans]]
iface_name = "wan0"
enable = true
