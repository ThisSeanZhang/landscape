[package]
name = "migration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid = { workspace = true }

[dependencies.sea-orm-migration]
workspace = true
features = ["runtime-tokio-rustls", "with-uuid", "with-json"]

[features]
default = ["sqlite"]
sqlite = ["sea-orm-migration/sqlx-sqlite"]
postgres-driver = ["sea-orm-migration/sqlx-postgres"]
mysql-driver = ["sea-orm-migration/sqlx-mysql"]
cli = ["sea-orm-migration/cli"]

[[bin]]
name = "migration"
path = "src/main.rs"
required-features = ["cli"]
