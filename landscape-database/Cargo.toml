[package]
name = "landscape-database"
version.workspace = true
edition.workspace = true

[dependencies]
landscape-common = { path = "../landscape-common" }
migration = { path = "./migration" }
sea-orm = { workspace = true, features = ["with-uuid", "with-json"] }
tokio = { workspace = true, features = ["time"] }

serde = { workspace = true }
serde_json = { workspace = true }

async-trait = { workspace = true }
tracing = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
tempfile = { workspace = true }


[features]
default = []
# NOT wired up: no sqlx-postgres dependency or connection code exists. The
# feature only toggles `schema_name` attributes on entities. The storage layer
# (StoreWriter retry classification, WAL semantics) is SQLite-only.
postgres = []
