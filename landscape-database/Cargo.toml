[package]
name = "landscape-database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
landscape-common = { path = "../landscape-common" }
migration = { path = "./migration", default-features = false }
sea-orm = { workspace = true, features = ["with-uuid", "with-json"] }
tokio = { workspace = true, features = ["time"] }

serde = { workspace = true }
serde_json = { workspace = true }

async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
tempfile = { workspace = true }


[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite", "migration/sqlite"]
# Additional drivers are additive. StoreWriter and migrations still rely on
# SQLite semantics; enabling a driver does not provide full backend support.
postgres-driver = ["sea-orm/sqlx-postgres", "migration/postgres-driver"]
# Legacy schema selection: retain the existing explicit public schema behavior.
postgres = ["postgres-driver"]
mysql-driver = ["sea-orm/sqlx-mysql", "migration/mysql-driver"]
