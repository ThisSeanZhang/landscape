[workspace.package]
version = "0.25.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ThisSeanZhang/landscape"
rust-version = "1.98"


[workspace]
members = [
    "landscape",
    "landscape-common",
    "landscape-core",
    "landscape-database",
    "landscape-gateway",
    "landscape-metric",
    "landscape-macro",
    "landscape-database/migration",
    "landscape-dns",
    "landscape-ebpf",
    "landscape-protobuf",
    "landscape-webserver",
]

resolver = "2"
default-members = ["landscape-webserver"]


[workspace.lints.clippy]
dbg_macro = "deny"


[workspace.dependencies]

# ============================================================================
# Core & System Utilities
# ============================================================================
sysinfo = "0.39.6"
anyhow = "1.0.104"
thiserror = "2.0.21"
once_cell = "1.21.4"
chrono = "0.4.45"
arc-swap = "1.9.2"
dashmap = "6.2.1"
regex = "1.13.1"
libc = "0.2.189"
nix = { version = "0.31.3" }
sysctl = "0.7.1"
homedir = "0.3.6"
hostname = "0.4.2"
socket2 = "0.6.5"
paste = "1.0.15"
rand = "0.10.3"
colored = "3.1.1"
dotenvy = "0.15.7"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "env",
] }

# ============================================================================
# Async & Concurrency
# ============================================================================
tokio = { version = "1.53.1" }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec", "net"] }
tokio-rustls = "0.26.5"
async-trait = "0.1.92"
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }

# ============================================================================
# Serialization & Data Formats
# ============================================================================
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
# Only used by geo's file cache — keep version pinned, do not upgrade
bincode = { version = "2.0.1", features = ["std", "serde"] }
toml = "1.1.6"
toml_edit = "0.25.15"
bytes = "1.12.1"
http = "1.5.0"
h2 = "0.4.15"
deku = "0.20.3"
zerocopy = "0.8.59"

# ============================================================================
# Network & Protocols
# ============================================================================
rtnetlink = { version = "0.23.0" }
netlink-packet-route = { version = "0.33.0" }
netlink-packet-core = { version = "0.9.0" }
netlink-sys = { version = "0.9.0" }
wl-nl80211 = { version = "0.7.0" }
genetlink = { version = "0.3.0" }
netlink-packet-generic = { version = "0.5.0" }
pnet = { version = "0.35.0" }
etherparse = "0.21.0"
cidr = { version = "0.3.2" }
idna = "1.1.0"
dhcproto = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "stream",
] }
hickory-server = "0.26.3"
hickory-resolver = "0.26.3"
hickory-proto = "0.26.3"
quinn = { version = "0.11.12", features = ["runtime-tokio"] }
zerotrie = { version = "0.2.5", features = ["alloc"] }
aho-corasick = "1.1.5"
ahash = "0.8.12"
moka = { version = "0.12.16", features = ["future"] }
zbus = "5.19.0"

# ============================================================================
# Web & HTTP
# ============================================================================
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = [
    "typed-header",
    "with-rejection",
] }
axum-server = "0.8.0"
headers = "0.4.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "fs",
    "trace",
    "compression-gzip",
    "compression-br",
] }
utoipa = { version = "6.0.0", features = ["uuid", "openapi_extensions"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }

# ============================================================================
# Security & Cryptography
# ============================================================================
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-pki-types = "1.15.1"
pem = "4.0.0"
rcgen = "0.14.10"
instant-acme = "0.8.5"
base64 = "0.23.1"
x509-parser = "0.18.1"
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
md-5 = "0.11.0"
sha1 = "0.11.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }

# ============================================================================
# Database & Storage
# ============================================================================
sea-orm = { version = "1.1.20" }
sea-orm-migration = { version = "1.1.20" }
# Pinned to 0.8.x for compatibility with sea-orm 1.x; do not bump to sqlx
# 0.10+/sea-orm 2.x until the sea-orm migration is planned
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
] }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = [
    "arrow",
    "zstd",
] }
hdrhistogram = { version = "7.5.4", features = ["serialization"] }

# ============================================================================
# Logging & Monitoring
# ============================================================================
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
tracing-appender = "0.2.5"

# ============================================================================
# eBPF & Kernel
# ============================================================================
libbpf-rs = { version = "0.27.2" }
libbpf-cargo = { version = "0.27.2" }
libbpf-sys = { version = "1.7.0" }

# ============================================================================
# Code Generation & Macros
# ============================================================================
quote = "1.0.47"
syn = "3.0.6"
quick-protobuf = "0.8.1"

# ============================================================================
# Development & Build Tools
# ============================================================================
pb-rs = "0.10.0"
walkdir = "2.5.0"
tempfile = "3.27.0"
jemallocator = "0.5.4"
jemalloc-ctl = "0.5.4"
bollard = "0.21.1"
portable-pty = { version = "0.9.0" }
pingora = { version = "0.9.0", default-features = false, features = [
    "proxy",
    "lb",
    "rustls",
] }
