[package]
name = "landscape-metric"
version.workspace = true
edition.workspace = true

[dependencies]
landscape-common = { path = "../landscape-common" }
landscape-core = { path = "../landscape-core" }

arc-swap = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
serde_json = { workspace = true }

duckdb = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
default = []
duckdb = ["dep:duckdb", "dep:r2d2", "dep:sqlx"]
duckdb-bundled = ["duckdb", "duckdb/bundled"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
