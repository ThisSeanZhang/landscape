[package]
name = "landscape-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["pool-native"]
pool-exp = []
pool-native = ["dep:rand", "dep:webpki-roots", "dep:rustls-platform-verifier"]

[dependencies]
landscape-common = { path = "../landscape-common" }
landscape-core = { path = "../landscape-core" }
landscape-protobuf = { path = "../landscape-protobuf" }

hickory-server = { workspace = true, features = ["https-ring", "quic-ring"] }
hickory-resolver = { workspace = true, features = [
    "system-config",
    "__tls",
    "__https",
    "quic-ring",
    "rustls-platform-verifier",
] }
hickory-proto = { workspace = true, features = ["mdns"] }

uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
arc-swap = { workspace = true }

tokio-util = { workspace = true, features = ["codec", "net"] }
tokio = { workspace = true, features = ['fs', 'net'] }
clap = { workspace = true }
libc = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
futures-util = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
h2 = { workspace = true }
base64 = { workspace = true }

nix = { workspace = true, features = ["socket", "uio", "net"] }
moka = { workspace = true }
dashmap = { workspace = true }
idna = { workspace = true }

# pool-native only
rand = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }


[dev-dependencies]
homedir = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
