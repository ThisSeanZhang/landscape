[package]
name = "landscape-common"
version.workspace = true
edition.workspace = true

[dependencies]
landscape-macro = { path = "../landscape-macro" }

anyhow = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
once_cell = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
homedir = { workspace = true }
hostname = { workspace = true }
dotenvy = { workspace = true }

tracing = { workspace = true }

uuid = { workspace = true }

libc = { workspace = true }
idna = { workspace = true }

paste = { workspace = true }
deku = { workspace = true }

dhcproto = { workspace = true, features = ["serde"] }
hickory-proto = { workspace = true }
sea-orm = { workspace = true, features = ["with-uuid", "with-json"] }
async-trait = { workspace = true }


toml = { workspace = true }

sysctl = { workspace = true }
md-5 = { workspace = true }

utoipa = { workspace = true, optional = true }

[features]
openapi = ["utoipa"]
# 在分配器头部记录 owner,dealloc 按真实归属扣减,各子系统 live 字节精确
# (每个分配额外 32 字节 + 少量写放大,仅调试用途)。
mem-track-precise = []

[dev-dependencies]
tempfile = { workspace = true }
