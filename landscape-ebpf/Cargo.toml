[package]
name = "landscape-ebpf"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only"
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
landscape-common = { path = "../landscape-common" }

thiserror = { workspace = true }
async-trait = { workspace = true }
libbpf-rs = { workspace = true }
libbpf-sys = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
# self_cell = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
arc-swap = { workspace = true }
nix = { workspace = true, features = ["net", "user", "sched"] }
rtnetlink = { workspace = true }
netlink-packet-route = { workspace = true }
futures = { workspace = true }

socket2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

# logs
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }

etherparse = { workspace = true }
zerocopy = { workspace = true, features = ["derive", "simd"] }

[build-dependencies]
libbpf-cargo = { workspace = true }
vmlinux = { git = "https://github.com/libbpf/vmlinux.h.git", rev = "83a228cf37fc65f2d14e4896a04922b5ee531a94" }

[features]
default = []
# Shared test infrastructure (crate::tests helpers). Every test-* feature
# implies it; enabling it alone compiles only the runtime-skeleton tests
# (root_stage, mss, net_utils, check, wire-less helpers).
test-support = []
# Per-topic eBPF tests: each feature compiles the matching BPF objects under
# src/bpf/tests/<topic>/ and gates the corresponding crate::tests modules.
# All require root to actually run.
test-route = ["test-support"]    # src/bpf/tests/route/
test-nat = ["test-support"]      # src/bpf/tests/nat/ (+ chain helpers used by session tests)
test-reader = ["test-support"]   # src/bpf/tests/reader/
test-chain = ["test-support"]    # src/bpf/tests/chain/ (incl. tc_chain)
test-metric = ["test-support"]   # src/bpf/tests/metric/
test-misc = ["test-support"]     # src/bpf/tests/misc/ (time, mark_layout, tproxy, wan_trie_probe, csum)
bench = ["test-support"]         # src/bpf/bench/
# Everything above at once (legacy umbrella; kept for cargo ttb / CI / docs).
bpf-test = [
    "test-route",
    "test-nat",
    "test-reader",
    "test-chain",
    "test-metric",
    "test-misc",
    "bench",
]
# # autoconf automake libtool pkg-config m4 make cmake clang llvm autopoint gawk
# apt-get install musl-tools musl-dev libargp-dev
static = ["libbpf-sys/static", "libbpf-sys/vendored"]
