name: Code Quality Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev zstd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-check-${{ github.sha }}
          restore-keys: ${{ runner.os }}-check-

      - name: Check Rust code
        run: cargo check --workspace --features metric-persistent

      - name: Run clippy
        run: cargo clippy --workspace --features metric-persistent -- -D warnings

      - name: Run clippy (feature matrix)
        run: |
          cargo clippy -p landscape-metric --no-default-features -- -D warnings
          cargo clippy -p landscape-webserver --no-default-features -- -D warnings
          cargo clippy -p landscape-common --features mem-track -- -D warnings
          cargo clippy -p landscape-common --features openapi -- -D warnings

  config-cli-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev zstd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-e2e-
            ${{ runner.os }}-check-

      - name: Run landscape-common unit tests
        run: cargo test -p landscape-common --lib

      - name: Build landscape-webserver
        run: cargo build -p landscape-webserver

      - name: Run config CLI end-to-end tests
        run: ./scripts/config_cli_test.sh target/debug/landscape-webserver

  rust-format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Check Rust version
        run: rustc --version

      - name: Check Rust code formatting
        run: cargo fmt -- --check

  c-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check C code formatting
        run: |
          clang-format-18 --version
          find landscape-ebpf/src/bpf -type f \( -name '*.c' -o -name '*.h' \) \
            ! -name 'vmlinux.h' \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  frontend-format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend code formatting
        run: pnpm --filter landscape-webui run format:check
