name: Code Quality Check

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main
      - dev
      - build
  pull_request:
    branches:
      - main
      - dev

jobs:
  rust-check:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-trixie
    env:
      CLANG: clang-19

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Clang 19 toolchain
        run: ./scripts/setup_debian13_build.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=on" >> $GITHUB_ENV

      - name: Check Rust code
        run: cargo check --locked --workspace --features metric-persistent

      - name: Run clippy
        run: cargo clippy --locked --workspace --features metric-persistent -- -D warnings

      - name: Run clippy (feature matrix)
        run: |
          cargo clippy --locked -p landscape-metric --no-default-features -- -D warnings
          cargo clippy --locked -p landscape-webserver --no-default-features -- -D warnings
          cargo clippy --locked -p landscape-common --features mem-track -- -D warnings
          cargo clippy --locked -p landscape-common --features openapi -- -D warnings

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  config-cli-e2e:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-trixie
    env:
      CLANG: clang-19

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Clang 19 toolchain
        run: ./scripts/setup_debian13_build.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=on" >> $GITHUB_ENV

      - name: Run landscape-common unit tests
        run: cargo test --locked -p landscape-common --lib

      - name: Build landscape-webserver
        run: cargo build --locked -p landscape-webserver

      - name: Run config CLI end-to-end tests
        run: ./scripts/config_cli_test.sh target/debug/landscape-webserver

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  rust-format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Check Rust version
        run: rustc --version

      - name: Check Rust code formatting
        run: cargo fmt -- --check

  c-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check C code formatting
        run: |
          clang-format-18 --version
          find landscape-ebpf/src/bpf -type f \( -name '*.c' -o -name '*.h' \) \
            ! -name 'vmlinux.h' \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  frontend-format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend code formatting
        run: pnpm --filter landscape-webui run format:check
