name: Build and Package Flow Edge Images

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - edge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_rust:
    runs-on: ${{ matrix.host }}
    container:
      image: rust:1.98.0-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 原生构建 / native builds ----
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            cross: false

          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            cross: false

          # ---- 交叉构建 / cross builds (cargo-zigbuild) ----
          - host: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            arch: riscv64
            cross: true

    env:
      CLANG: clang-19
      TARGET_ARCH: ${{ matrix.target }}
      TMP_DIR: tmp/${{ matrix.arch }}/redirect_prog
      BUILD_DIR: dockerfiles/redirect_prog
      APPS_DIR: tmp/${{ matrix.arch }}/redirect_prog/apps

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Clang 19 toolchain
        run: ./scripts/setup_debian13_build.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        run: |
          SCCACHE_ARCH=x86_64
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            SCCACHE_ARCH=aarch64
          fi
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-${SCCACHE_ARCH}-unknown-linux-musl.tar.gz | tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=on" >> $GITHUB_ENV

      - name: Setup zig and cargo-zigbuild
        if: matrix.cross
        run: |
          pip3 install --break-system-packages ziglang==0.16.0
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build Rust binaries
        run: |
          echo "Building for $TARGET_ARCH..."
          if [ "${{ matrix.cross }}" = "true" ]; then
            ./scripts/build_edge_bins.sh "$TARGET_ARCH"
          else
            cargo build --locked --release \
              --package landscape-ebpf \
              --bin redirect_demo_server \
              --bin redirect_pkg_handler \
              --target "$TARGET_ARCH"
          fi

      - name: Prepare build artifacts
        run: |
          echo "Prepare $TMP_DIR..."

          # 清理目录
          rm -rf $TMP_DIR
          mkdir -p $APPS_DIR/server

          # 复制产物
          cp target/$TARGET_ARCH/release/redirect_demo_server $APPS_DIR/server/redirect_demo_server
          echo '#!/bin/bash' > $APPS_DIR/server/run.sh
          echo '/app/server/redirect_demo_server' >> $APPS_DIR/server/run.sh
          chmod +x $APPS_DIR/server/run.sh

          cp target/$TARGET_ARCH/release/redirect_pkg_handler $APPS_DIR/redirect_pkg_handler
          chmod +x $APPS_DIR/redirect_pkg_handler

          cp $BUILD_DIR/start.sh $APPS_DIR/start.sh
          chmod +x $APPS_DIR/start.sh

          # 复制 dockerfiles/redirect_prog 目录（包括 Dockerfile)
          cp -r $BUILD_DIR/* $TMP_DIR/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: ${{ env.TMP_DIR }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  docker_build_and_push:
    runs-on: ubuntu-latest
    needs: build_rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
          - arch: riscv64
            platform: linux/riscv64
            target: riscv64gc-unknown-linux-gnu

    env:
      DOCKER_PLATFORM: ${{ matrix.platform }}
      TMP_DIR: tmp/${{ matrix.arch }}/redirect_prog

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.arch }}
          path: ${{ env.TMP_DIR }}

      - name: Verify build artifacts
        run: |
          echo "=== TMP_DIR Tree ==="
          find $TMP_DIR
          echo "=== Dockerfile Content ==="
          cat $TMP_DIR/Dockerfile
          echo "=== apps/server Content ==="
          ls -l $TMP_DIR/apps/server || echo "apps/server not found!"

      - name: Setup QEMU for cross-build
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (by digest)
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/landscape-edge"

          # 单架构镜像按 digest 推送（不打标签，不产生可拉取的中间标签），
          # 由 publish_manifest 通过 digest 合并为多架构
          # Push single-arch images by digest (no tag, so no pullable
          # intermediate tags); publish_manifest merges them via digest.
          docker buildx build \
            --platform $DOCKER_PLATFORM \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE_NAME,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${{ runner.temp }}/digest-${{ matrix.arch }}.json" \
            -f $TMP_DIR/Dockerfile \
            $TMP_DIR

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}.json

  publish_manifest:
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/landscape-edge"

          digest() {
            python3 -c "import json;print(json.load(open('digests/digest-$1.json'))['containerimage.digest'])"
          }
          AMD64_DIGEST=$(digest amd64)
          ARM64_DIGEST=$(digest arm64)
          RISCV64_DIGEST=$(digest riscv64)

          # push -> 仅日期标签；workflow_dispatch -> 日期 + 滚动 latest
          # push -> date tag only; workflow_dispatch -> date + rolling latest
          TAGS=(-t "$IMAGE_NAME:$(date -u +%Y%m%d)")
          if [ "${{ github.event_name }}" != "push" ]; then
            TAGS+=(-t "$IMAGE_NAME:latest")
          fi

          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE_NAME@${AMD64_DIGEST}" \
            "$IMAGE_NAME@${ARM64_DIGEST}" \
            "$IMAGE_NAME@${RISCV64_DIGEST}"
